[project]
name = "adlc-fastapi"
version = "0.1.0"
description = "FastAPI pass-through for the agent service"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
